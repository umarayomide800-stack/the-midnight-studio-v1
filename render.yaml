services:
  - type: web
    name: the-midnight-studio-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run db:generate --workspace server && npm run build --workspace server
    releaseCommand: npm run db:push --workspace server && npm run db:seed --workspace server
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://the-midnight-studio-v1-1.onrender.com
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false

  - type: static
    name: the-midnight-studio-web
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://the-midnight-studio-api.onrender.com
